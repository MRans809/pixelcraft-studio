server:
  port: 8080
  forward-headers-strategy: framework

spring:
  application:
    name: pixelcraft-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/pixelcraft?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USER:pixelcraft}
    password: ${DB_PASSWORD:pixelcraft_dev}
    hikari:
      initialization-fail-timeout: 60000
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 24MB
  jackson:
    default-property-inclusion: non_null

mybatis:
  configuration:
    map-underscore-to-camel-case: true

app:
  upload-dir: ${UPLOAD_DIR:./uploads}
  task-stage-delay-ms: ${TASK_STAGE_DELAY_MS:2500}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true


